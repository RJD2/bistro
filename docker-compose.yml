version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bistro
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    environment:
      TOKEN: ${TOKEN}
      DB: postgresql+asyncpg://user:password@postgres:5432/bistro
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: